# SayCue preset — generyczny unik/krok (arcade/platformówki)
# Frazy gier z rdzenia: arcade-dash (warianty fonetyczne i skróty).
# system; klawisze gry = presety (architektura: jedna gra aktywna naraz).
# Gołe „dash" w rdzeniu cieniowało bindy gier dla T2/HOTAS (spurious shift+space
# w symulatorach lotu). Tu frazy działają tylko przy aktywnej „grze arcade".
# Warianty fonetyczne „wiki" (uniki) i EN „dash" (dasz).
id: arcade-dash
version: 1.0.0
name: Unik i skok (arcade)
kind: game
platforms: [win, linux-x11]
author: SayCue contributors
license: MIT
requires: { obs: false }

phrases:
  - dasz
  - uniki
  - shift dash
  - dash
  - wiki

commands:
  - id: press_dash
    intent: input.keys
    phrases: ["dasz", "uniki", "shift dash", "dash", "wiki"]
    slots: { keys: [shift, space] }

notes: |
  Komenda demo W1 (shift+space = unik) przeniesiona z rdzenia do presetu — aktywuj
  tylko w grach, gdzie ma sens (arcade/platformówki). W symulatorach lotu
  (dcs/msfs) trzymaj wyłączoną: gołe „dash" nie będzie wtedy w gramatyce.
  Frazy bez prefiksu gry — celowo: to preset uniwersalny dla gier arcade;
  walidator wymaga unikalności w całym katalogu presets/ (S4), co jest spełnione.
