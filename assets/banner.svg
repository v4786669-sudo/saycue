<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="SayCue — offline voice assistant for streamers">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1117"/>
      <stop offset="1" stop-color="#161a26"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <!-- logo mark -->
  <g transform="translate(180,140)">
    <circle cx="0" cy="0" r="150" fill="#1b2030"/>
    <rect x="-40" y="-108" width="80" height="150" rx="40" fill="#8b5cf6"/>
    <path d="M-108 0 Q0 114 108 0" stroke="#8b5cf6" stroke-width="26" fill="none" stroke-linecap="round"/>
    <rect x="-24" y="76" width="48" height="56" rx="14" fill="#8b5cf6"/>
    <rect x="-68" y="128" width="136" height="26" rx="13" fill="#8b5cf6"/>
    <circle cx="124" cy="-104" r="26" fill="#22d3ee"/>
  </g>
  <!-- wordmark + tagline -->
  <text x="470" y="240" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="120" font-weight="800" fill="#f8fafc" letter-spacing="4">SayCue</text>
  <text x="470" y="330" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="46" font-weight="500" fill="#a5b4fc">Mówisz — stream się nie psuje.</text>
  <text x="470" y="392" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="34" font-weight="400" fill="#6b7280">Offline · Bez chmury · Bez AI w ścieżce sterowania</text>
  <rect x="470" y="430" width="360" height="6" rx="3" fill="#8b5cf6"/>
  <text x="470" y="500" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="30" font-weight="400" fill="#4b5563">Steruj OBS, aplikacjami i grami — głosem.</text>
</svg>
