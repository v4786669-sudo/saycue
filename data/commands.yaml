# commands.yaml — rdzeń SayCue (PL, architektura §2.2 + PLAN §5)
# W1: frazy zasilają initial_prompt Whisper. W2 (t13): parser + rejestr akcji.
#
# DEDUPLIKACJA (t10, kapitan): frazy obecne w PRESETACH (obs-core/apps-open/
# apps-streaming) usunięte z rdzenia — wygrywa preset (parser/rules.py), a logi
# „fraza zduplikowana" znikają. Niżej zostają wyłącznie frazy rdzeniowe.
# Szablony z dynamicznym slotem ({target}/{scene}) rozwiązują W2.
version: 1
language: pl
# hotwords: punktowy bias tokenów (faster-whisper ≥1.2) TYLKO dla krótkich,
# problematycznych komend. UWAGA (zmierzone, G1): biasowanie WSZYSTKICH fraz
# degeneruje greedy decoding w pętle powtórzeń — trzymać ≤3 słowa i
# weryfikować pełnym evalem (python eval/run_eval.py).
hotwords: ["cisza", "replay"]
commands:
  - id: open_spotify
    phrases: ["spotify"]
    intent: app.open
    slots: { target: spotify }

  - id: open_discord
    phrases: ["discord"]
    intent: app.open
    slots: { target: discord }

  - id: open_obs
    phrases: ["obs"]
    intent: app.open
    slots: { target: obs }

  - id: obs_scene_pvp
    phrases: ["pvp"]
    intent: obs.scene
    slots: { scene: "PVP" }

  - id: obs_scene_start
    phrases: ["przełącz na startową"]
    intent: obs.scene
    slots: { scene: "Starting Soon" }

  - id: mute_mic
    phrases: ["cisza", "wycisz"]  # gołe „wycisz" = mikrofon (decyzja t13)
    intent: obs.mute
    slots: { source: mic, state: toggle }

  - id: obs_record_start
    phrases: ["rozpocznij nagrywanie", "start nagrywania"]
    intent: obs.record
    slots: { state: start }

  - id: obs_record_stop
    phrases: ["zatrzymaj nagrywanie"]
    intent: obs.record
    slots: { state: stop }

  - id: obs_replay
    # „replej/replejk" = warianty fonetyczne (t9, G2): Whisper słyszy zapożyczenie
    # EN wymawiane po polsku jako „teplejt/teplejk" — mechanizm §2.3 („spoty fi")
    phrases: ["replej", "replejk"]
    intent: obs.replay
    slots: {}

  - id: volume_down
    phrases: ["ścisz", "zmniejsz głośność", "cichutko"]
    intent: system.volume
    slots: { delta: -20 }

  - id: volume_up
    phrases: ["zwiększ głośność"]
    intent: system.volume
    slots: { delta: 20 }

  - id: press_dash
    # „wiki" = wariant fonetyczny (t9, decyzja kapitana 2026-10-23): Whisper
    # słyszy „uniki" jako „wiki" (rapidfuzz 0,667 < 0,78). Brak kolizji.
    phrases: ["dasz", "uniki", "shift dash", "dash", "wiki"]
    intent: input.keys
    slots: { keys: [shift, space] }

  - id: open_kalkulator
    phrases: ["otwórz kalkulator", "włącz kalkulator", "kalkulator"]
    intent: app.open
    slots: { target: kalkulator }

  # Szablony z dynamicznym slotem (architektura §2.3 krok 6):
  # "otwórz {target}" — wartość slotu wycinana z tekstu i rozwiązywana po
  # apps.yaml + apps[] presetów; "scena {scene}" — po scenach aktywnych komend.
  # R-02 (t10): nierozpoznana wartość slotu → ASK (nigdy akcja z surową wartością).
  - id: open_app_template
    phrases: ["otwórz {target}", "uruchom {target}", "odpal {target}", "włącz {target}"]
    intent: app.open

  - id: scene_template
    phrases: ["scena {scene}", "przełącz na scenę {scene}"]
    intent: obs.scene
