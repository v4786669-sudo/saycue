name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    name: ruff + pytest (py3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: |
          uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python -e ".[dev,actions,obs,parser]"

      - name: Ruff (lint + format check)
        run: |
          .venv/bin/ruff check src tests bench eval scripts
          .venv/bin/ruff format --check src tests bench eval scripts

      - name: Pytest (unit; model tests skipped in CI)
        run: .venv/bin/python -m pytest -m "not models and not audio_device"

  model-manifest:
    name: manifest JSON valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install core deps
        run: pip install -e .
      - run: python scripts/check_manifest.py

  presets:
    name: presety YAML (§2.5) — schemat + reguły S2–S6 + zakaz kodu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Walidacja presetów (presets/validate.py)
        run: |
          pip install pyyaml jsonschema pynacl
          python presets/validate.py --json
      - name: Podpis manifestu presetów (t19, supply-chain)
        run: |
          python scripts/sign_presets_index.py --verify
      - name: Zakaz plików wykonywalnych w katalogach presetów (R-04)
        run: |
          # wyjątek: presets/validate.py + test_validate.py = narzędzia walidacji
          if find presets -mindepth 2 -type f \( -name "*.py" -o -name "*.sh" -o -name "*.exe" -o -name "*.dll" -o -name "*.bat" -o -name "*.ps1" \) | grep -q .; then
            echo "FAIL: kod w katalogu presetu — presety to YAML, nie kod (§2.5)"; exit 1
          fi
          echo "OK: presety czysto deklaratywne"
