name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    name: ruff + pytest (py3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: |
          uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python -e ".[dev]"

      - name: Ruff (lint + format check)
        run: |
          .venv/bin/ruff check src tests bench eval scripts
          .venv/bin/ruff format --check src tests bench eval scripts

      - name: Pytest (unit; model tests skipped in CI)
        run: .venv/bin/python -m pytest -m "not models and not audio_device"

  model-manifest:
    name: manifest JSON valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/check_manifest.py
