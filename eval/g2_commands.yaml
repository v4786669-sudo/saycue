# eval/g2_commands.yaml — 20 fraz PL na bramkę G2 (PLAN §5: ≥90% wykonanych, p95 ≤1,2 s)
# = 15 fraz G1 (eval/commands.yaml) + 5 rozszerzeń z rdzenia commands.yaml.
# Pole `wav` wskazuje nagranie (g1_XX współdzielone z G1; g2_XX generowane osobno).
# `intent` = oczekiwana intencja parsera; `slots` = oczekiwane sloty (o ile stałe).
